# Vale configuration for CreditShield documentation

StylesPath = styles

MinAlertLevel = suggestion

# Glob patterns to check
[*.md]
# Apply custom DocsPilot style rules
BasedOnStyles = DocsPilot

# Ignore code blocks and front matter
BlockIgnores = (?s) *```.*?```
TokenIgnores = (\$+[^\n$]+\$+), (`[^`]+`)
