  'loan processor': loan officer
  'loan agent': loan officer
  'risk analyst': credit analyst
  'credit officer': credit analyst
  'field agent': field officer
  'verification agent': field officer
  'field executive': field officer
  'credit approver': underwriter
  'sanctioning authority': underwriter
  'decisioner': underwriter
  'customer': borrower
  'applicant': borrower
  'loan applicant': borrower
  
